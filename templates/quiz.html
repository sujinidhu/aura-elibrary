<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURA Quiz</title>

    <style>
        body {
            color: white;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 40px;
            
            /* Fixed Background Syntax: Gradient overlay goes FIRST to stay on top of the image */
            background-image: 
                linear-gradient(rgba(0, 0, 0, 0.3), rgba(0, 0, 0, 0.6)), 
                url("{{ url_for('static', filename='1234.png') }}");

            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            background-color: #141519; /* Fallback color */
        }

        /* 🔝 Back Button */
        .back-btn {
            position: fixed;
            top: 20px;
            right: 30px;
            color: white;
            text-decoration: none;
            font-size: 12px;
            text-transform: uppercase;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 8px 12px;
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.4);
            z-index: 1000;
            transition: 0.3s;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        /* Container */
        .container {
            max-width: 700px;
            margin: auto;
            margin-top: 60px;
        }

        /* Title */
        .title {
            font-size: 28px;
            font-weight: bold;
            color: #f47521;
            margin-bottom: 40px;
            text-transform: uppercase;
            text-align: center;
        }

        /* Question Card */
        .q-card {
            background: rgba(20, 21, 25, 0.75); /* Slightly higher opacity for readability */
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 25px;
            padding: 30px;
            margin-bottom: 30px;
            backdrop-filter: blur(8px);
        }

        /* Question */
        .question {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        /* Options */
        .option {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.3s;
        }

        .option:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        /* Radio Customization */
        input[type="radio"] {
            accent-color: #f47521;
            transform: scale(1.2);
        }

        /* Option Text */
        .option span {
            color: #ddd;
        }

        /* Submit Button */
        .btn {
            width: 100%;
            padding: 18px;
            background: #f47521;
            color: black;
            border: none;
            border-radius: 15px;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            margin-top: 20px;
            transition: 0.3s;
        }

        .btn:hover {
            background: #ff8c3a;
            transform: translateY(-2px);
        }
    </style>
</head>

<body>

    <a href="/" class="back-btn">← Back to Hub</a>

    <div class="container">

        <div class="title">{{ quiz.title }}</div>

        <form action="/submit_quiz" method="POST">
            <input type="hidden" name="quiz_id" value="{{ quiz_id }}">

            {% for item in quiz.questions %}
            {% set q_idx = loop.index0 %}

            <div class="q-card">
                <div class="question">
                    Q{{ loop.index }}. {{ item.q }}
                </div>

                {% for opt in item.options %}
                <label class="option">
                    <input type="radio" name="q{{ q_idx }}" value="{{ opt }}" required>
                    <span>{{ opt }}</span>
                </label>
                {% endfor %}
            </div>

            {% endfor %}

            <button type="submit" class="btn">
                Submit Examination
            </button>
        </form>

    </div>

</body>
</html>
