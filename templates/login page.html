<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AURA | Login</title>

<style>
body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: black;
    font-family: Arial, sans-serif;
    color: white;
    overflow: hidden;
}

/* Background Video */
#bg-video {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: -1;
}

/* Login Card */
.login-card {
    background: rgba(0, 0, 0, 0.6);
    backdrop-filter: blur(15px);
    padding: 40px;
    border-radius: 30px;
    width: 350px;
    text-align: center;
    border: 1px solid rgba(255,255,255,0.1);
    box-shadow: 0 0 30px rgba(0,0,0,0.5);
}

/* Title */
.title {
    font-size: 32px;
    font-weight: bold;
    color: #f47521;
}

/* Subtitle */
.subtitle {
    font-size: 10px;
    color: gray;
    letter-spacing: 3px;
    margin-bottom: 30px;
}

/* Inputs */
input {
    width: 100%;
    padding: 15px;
    margin-bottom: 15px;
    border-radius: 10px;
    border: 1px solid #333;
    background: black;
    color: white;
}

/* Glow effect */
input:focus {
    border-color: #f47521;
    box-shadow: 0 0 10px rgba(244,117,33,0.5);
    outline: none;
}

/* Button */
button {
    width: 100%;
    padding: 15px;
    background: #f47521;
    color: black;
    font-weight: bold;
    border: none;
    border-radius: 10px;
    cursor: pointer;
}

/* Footer */
.footer {
    font-size: 10px;
    margin-top: 20px;
    color: gray;
}
</style>
</head>

<body>

<!-- Video -->
<video autoplay muted loop playsinline id="bg-video">
    <source src="{{ url_for('static', filename='1768921451.mp4') }}" type="video/mp4">
</video>

<!-- Login Card -->
<div class="login-card">

    <div class="title">AURA</div>
    <div class="subtitle">ACCESS PORTAL</div>

    {% if error %}
    <div style="color:red; margin-bottom:10px;">{{ error }}</div>
    {% endif %}

    <form action="/login" method="POST">
        <input type="text" name="username" placeholder="Username" required>
        <input type="password" name="password" placeholder="Password" required>

        <button type="submit">LOGIN</button>
    </form>

    <div class="footer">AUTHORIZED PERSONS ONLY</div>

</div>

</body>
</html>
