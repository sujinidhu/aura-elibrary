<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AURA Library</title>

<style>
body {
    color: white;
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0px;

    background-image: url("{{ url_for('static', filename='library.png') }}");
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
}
/* Container */
.container {
    width: 100%;   /* full width */
    margin-top: 120px; /* optional small inner spacing */
}
/* Header */
.header {
    position: relative;
    margin-bottom: 40px;
}

.title {
    font-size: 28px;
    font-weight: bold;
    color: #f47521;
    font-style: italic;
}

.back-btn:hover {
    color: white;
}

/* Grid */
.grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr); /* 🔥 4 cards per row */
    gap: 20px; /* space between cards */
}
/* Card */
.card {
    background: black;
    border: 1px solid #1f2128;
    border-radius: 15px;
    padding: 30px;
    transition: 0.1s;
}

.card:hover {
    border-color: #f47521;
    transform: translateY(-5px);
}

/* Image */
.image-box {
    width: 100%;
    height: 180px;
    background: black;
    border-radius: 10px;
    overflow: hidden;
    margin-bottom: 20px;
}

.image-box img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0.8;
    transition: 0.3s;
}

.image-box img:hover {
    opacity: 1;
}

/* Text */
.book-title {
    font-size: 14px;
    font-weight: bold;
    text-transform: uppercase;
    margin-bottom: 5px;
}

.author {
    font-size: 10px;
    color: gray;
    margin-bottom: 20px;
    text-transform: uppercase;
    letter-spacing: 2px;
}

/* Button */
.back-btn {
    position: fixed;
    top: 20px;
    right: 30px;

    font-size: 12px;
    color: gray;
    text-decoration: none;
    border: 1px solid #333;
    padding: 8px 12px;
    border-radius: 8px;
    text-transform: uppercase;

    background: rgba(0,0,0,0.4);
}

.btn:hover {
    
    color: whitesmoke;
}
</style>
</head>

<body>

<div class="container">

    <!-- HEADER -->
   
<div class="header">
    <div class="title">AURA | LIBRARY</div>
</div>

<a href="/" class="back-btn">← Back to Hub</a>
    

    <!-- BOOK GRID -->
    <div class="grid">

        {% for b in items %}
        <div class="card">

            <div class="image-box">
                <img src="{{ b.image }}" alt="{{ b.title }}">
            </div>

            <div class="book-title">{{ b.title }}</div>
            <div class="author">{{ b.author }}</div>

            <a href="{{ b.link }}" target="_blank" class="btn">
                Read Now
            </a>

        </div>
        {% endfor %}

    </div>

</div>

</body>
</html>
