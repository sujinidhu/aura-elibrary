<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>AURA Exams</title>

<style>
body {
    /* Fixed Background Logic */
    background-image: 
        linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.8)), 
        url("{{ url_for('static', filename='1234.png') }}");
    
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    background-repeat: no-repeat;
    background-color: #0b0b0b; /* Fallback */
    
    color: white;
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 40px;
}

/* Container */
.container {
    max-width: 1000px;
    margin: auto;
}

/* Header */
.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 40px;
}

.title {
    font-size: 28px;
    font-weight: bold;
    color: #f47521;
    font-style: italic;
}

.back {
    font-size: 12px;
    color: gray;
    text-decoration: none;
    background: rgba(0,0,0,0.3);
    padding: 5px 10px;
    border-radius: 5px;
}

.back:hover {
    color: white;
    background: rgba(255,255,255,0.1);
}

/* Grid */
.grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 20px;
}

/* Card */
.card {
    background: rgba(20, 21, 25, 0.8); /* Semi-transparent to show BG blur */
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 30px;
    padding: 25px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    transition: 0.3s;
    backdrop-filter: blur(10px); /* Makes cards look premium against BG */
}

.card:hover {
    border-color: #3b82f6;
    transform: translateY(-5px);
}

/* Text */
.card h3 {
    margin: 0;
    font-size: 18px;
    text-transform: uppercase;
}

.card p {
    font-size: 10px;
    color: #aaa;
    margin-top: 5px;
}

/* Button */
.btn {
    background: #3b82f6;
    color: white;
    padding: 10px 18px;
    border-radius: 10px;
    text-decoration: none;
    font-weight: bold;
    font-size: 12px;
    text-transform: uppercase;
    transition: 0.2s;
}

.btn:hover {
    background: #2563eb;
    box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <div class="title">AURA | EXAMS</div>
        <a href="/" class="back">← Back Home</a>
    </div>

    <div class="grid">

        {% for q in quizzes %}
        <div class="card">
            <div>
                <h3>{{ q.title }}</h3>
                <p>Evaluation Portal</p>
            </div>

            <a href="/quiz/{{ q.id }}" class="btn">Start Test</a>
        </div>
        {% endfor %}

    </div>

</div>

</body>
</html>
