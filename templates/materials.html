<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AURA Study Materials</title>

<style>
body {
    margin: 0;
    padding: 40px;
    font-family: Arial, sans-serif;
    color: white;

    /* Background with overlay */
    background-image: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)),
    url("{{ url_for('static', filename='materials.png') }}");
    
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
}

/* Container */
.container {
    width: 100%;   /* full width */
    margin-top: 120px; /* optional small inner spacing */
}

/* Header */
.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 50px;
}

.title {
    font-size: 28px;
    font-weight: bold;
    color: #f47521;
    font-style: italic;
}

.back-btn {
    font-size: 10px;
    text-transform: uppercase;
    color: gray;
    border: 1px solid #333;
    padding: 8px 12px;
    border-radius: 8px;
    text-decoration: none;
}

.back-btn:hover {
    color: white;
}

/* Grid */
.grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr); /* 🔥 4 cards per row */
    gap: 20px; /* space between cards */
}

/* Card */
.card {
    background: rgba(20,21,25,0.9);
    border: 1px solid #1f2128;
    border-radius: 30px;
    padding: 25px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    transition: 0.3s;
}

.card:hover {
    border-color: #f47521;
    transform: translateY(-5px);
}

/* Tag */
.tag {
    background: rgba(244,117,33,0.1);
    color: #f47521;
    font-size: 10px;
    padding: 5px 10px;
    border-radius: 20px;
    display: inline-block;
    margin-bottom: 15px;
    text-transform: uppercase;
}

/* Text */
.card-title {
    font-size: 16px;
    font-weight: bold;
    text-transform: uppercase;
    margin-bottom: 5px;
}

.subtitle {
    font-size: 10px;
    color: gray;
    margin-bottom: 20px;
}

/* Button */
.btn {
    display: block;
    text-align: center;
    padding: 12px;
    border-radius: 15px;
    border: 1px solid #333;
    color: white;
    text-decoration: none;
    font-size: 11px;
    font-weight: bold;
    text-transform: uppercase;
    transition: 0.3s;
}

.btn:hover {
    background: #f47521;
    color: black;
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <div class="title">AURA | STUDY MATERIALS</div>
        <a href="/" class="back-btn">← Back to Hub</a>
    </div>

    <div class="grid">

        {% for m in items %}
        <div class="card">

            <div>
                <span class="tag">{{ m.type }}</span>

                <div class="card-title">{{ m.title }}</div>
                <div class="subtitle">Academic Resource</div>
            </div>

            <a href="{{ m.link }}" target="_blank" class="btn">
                Read Study Material
            </a>

        </div>
        {% endfor %}

    </div>

</div>

</body>
</html>
